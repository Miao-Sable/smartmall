# SmartMall 部署用 Nginx 站点配置
# 作用：托管前端静态文件 + 反向代理 /api 到 FastAPI(Uvicorn)
#
# 用法：
#   1. 放到 /etc/nginx/conf.d/smartmall.conf（或 sites-available 并软链到 sites-enabled）
#   2. 替换下面的 server_name 与 root 路径
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name smartmall.example.com;          # ← 改成你的域名

    # 前端构建产物目录（vite build 输出 frontend/dist）
    root /opt/smartmall/frontend/dist;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA 前端：所有非文件路径回退到 index.html，交给 vue-router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反代到本机 Uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 可选：暴露 Swagger 文档（后端根路径，不在 /api 下）
    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }
}

